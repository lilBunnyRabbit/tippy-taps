[package]
name = "tippy-taps"
version = "0.1.0"
edition = "2024"
description = "Offline keystroke, click and scroll counter that starts with Windows"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = { version = "0.26.1", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Devices_Display", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input", "Win32_UI_Input_XboxController", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Security"] }

[build-dependencies]
winresource = "0.1.34"
